schema_version: "1.0"
name: a11y-autoloads-modal
description: A modal with a drag interaction loads accessibility-architect unasked.
tags: [autoload]
execution:
  prompt: "I'm adding a modal to crop an uploaded image. What do I need to get right before I write it?"
  max_turns: 25
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - {type: regex, name: names-modal-contract, pattern: "focus (returns?|back) to|2\\.5\\.7|drag|24.24", flags: i}
  - {type: tool_used, name: loads-accessibility, tool: Skill, input_match: "accessibility-architect"}
